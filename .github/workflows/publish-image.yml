name: Publish Image

on:
  push: # push 到主分支自动 发布
    branches: ["feature-ejs"]
    paths-ignore: # 忽略一些不必要的文件
      - ".gitignore"
      - "README.md"
      - ".vscode/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v1
        with:
          registry: registry.cn-shanghai.aliyuncs.com # 声明镜像源
          username: ${{ secrets.ALIYUN_USER }} # 当前github 用户名
          password: ${{ secrets.ALIYUN_PWD }} # 需要去 https://github.com/settings/tokens 生成一个 名为 token，注意此token 需要读写 packages 等权限
      - uses: actions/setup-node@v2
        with:
          node-version: "20.12.1"
      - name: Install and Build 🔧
        run: |
          npm i
          npm run build

      - name: Show Dir
        run: ls

      - name: Build the  Docker image
        run:
          | # 使用 上一步写的 Dockerfile 构建镜像并发布到私有仓库； 发布完成可以去 https://github.com/songxingguo?tab=packages 查看
          docker build . --file Dockerfile --tag registry.cn-shanghai.aliyuncs.com/songxingguo/resume:latest
          docker push registry.cn-shanghai.aliyuncs.com/songxingguo/resume:latest
